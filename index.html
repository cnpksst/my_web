<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Phát Nhạc & Video Đa Nguồn</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #007aff; }
        .section { border: 1px solid #e5e5ea; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: #fafafa; }
        h3 { margin-top: 0; font-size: 16px; color: #555; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #007aff; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-top: 8px; width: 100%; }
        button:hover { background: #0056b3; }
        #player-container { text-align: center; margin: 20px 0; display: none; }
        video, audio { width: 100%; max-height: 300px; background: #000; border-radius: 8px; }
        #now-playing { font-weight: bold; margin-top: 5px; color: #333; font-size: 14px; }
        .playlist { max-height: 200px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; background: white; padding: 0; list-style: none; }
        .playlist li { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 14px; display: flex; justify-content: space-between; }
        .playlist li:hover { background: #f0f0f5; }
        .playlist li.active { background: #e3f2fd; color: #007aff; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎵 Media Multi-Player</h2>

    <!-- NGUỒN 1: TỪ IPHONE / MÁY TÍNH -->
    <div class="section">
        <h3>1. Chọn file từ thiết bị (iPhone, iPad, PC)</h3>
        <!-- Thuộc tính multiple cho phép chọn nhiều file cùng lúc trên iOS -->
        <input type="file" id="local-file-input" accept="audio/*,video/*" multiple>
    </div>

    <!-- NGUỒN 2: TỪ GOOGLE DRIVE -->
    <div class="section">
        <h3>2. Dán Link Google Drive (File hoặc Thư mục công khai)</h3>
        <input type="text" id="drive-url-input" placeholder="Dán link file hoặc link folder vào đây...">
        <button id="add-drive-btn">Thêm vào danh sách phát</button>
    </div>

    <!-- TRÌNH PHÁT MEDIA -->
    <div id="player-container">
        <div id="now-playing">Đang phát: Chưa có file</div>
        <div id="media-wrapper" style="margin-top: 10px;">
            <!-- Mặc định dùng thẻ video vì nó phát được cả tiếng lẫn hình, tối ưu cho iOS -->
            <video id="main-player" controls playsinline controlsList="nodownload"></video>
        </div>
    </div>

    <!-- DANH SÁCH PHÁT -->
    <div class="section">
        <h3>📋 Danh sách bài hát / Video (<span id="queue-count">0</span>)</h3>
        <ul id="playlist-view" class="playlist"></ul>
    </div>
</div>

<script>
    let playlist = [];
    let currentIndex = -1;

    const localFileInput = document.getElementById('local-file-input');
    const driveUrlInput = document.getElementById('drive-url-input');
    const addDriveBtn = document.getElementById('add-drive-btn');
    const mainPlayer = document.getElementById('main-player');
    const playlistView = document.getElementById('playlist-view');
    const playerContainer = document.getElementById('player-container');
    const nowPlayingText = document.getElementById('now-playing');
    const queueCount = document.getElementById('queue-count');

    // 1. XỬ LÝ FILE CỤC BỘ (TỪ IPHONE/THIẾT BỊ)
    localFileInput.addEventListener('change', function(e) {
        const files = e.target.files;
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            // Tạo Blob URL tạm thời để trình duyệt iOS có thể đọc trực tiếp từ bộ nhớ máy
            const fileURL = URL.createObjectURL(file);
            playlist.push({
                name: file.name,
                url: fileURL,
                type: file.type
            });
        }
        updatePlaylistUI();
        if (currentIndex === -1 && playlist.length > 0) playTrack(0);
        localFileInput.value = ''; // Reset input để có thể chọn lại
    });

    // 2. XỬ LÝ ĐƯỜNG LINK GOOGLE DRIVE
    addDriveBtn.addEventListener('click', function() {
        const url = driveUrlInput.value.trim();
        if (!url) {
            alert('Vui lòng dán link Google Drive hợp lệ!');
            return;
        }

        // Kiểm tra xem là link File hay link Folder
        if (url.includes('/drive/folders/') || url.includes('id=')) {
            // Trường hợp Link Folder
            // LƯU Ý: Do bảo mật của Google, để lấy HẾT FILE TRONG FOLDER mà không cần backend cần dùng API Key công khai
            // Ở đây hệ thống sẽ tự bóc tách ID Folder để chuẩn bị hướng xử lý
            const folderId = extractFolderId(url);
            if (folderId) {
                alert('Đang kết nối thư mục. Lưu ý: Đảm bảo thư mục được cấu hình "Bất kỳ ai có đường liên kết đều có thể xem".');
                // Gọi hàm giả lập hoặc fetch dữ liệu từ API công khai của Google
                fetchGoogleDriveFolder(folderId);
            } else {
                alert('Không thể nhận diện ID Thư mục. Vui lòng kiểm tra lại link!');
            }
        } else if (url.includes('/file/d/')) {
            // Trường hợp Link File riêng lẻ
            const fileId = extractFileId(url);
            if (fileId) {
                // Chuyển đổi thành link stream trực tiếp vượt lỗi trên iOS Safari
                const streamURL = `https://google.com{fileId}`;
                playlist.push({
                    name: `Google Drive File (${fileId.substring(0,5)}...)`,
                    url: streamURL,
                    type: 'video/mp4' // Gán mặc định định dạng video/audio để trình phát nhận diện
                });
                updatePlaylistUI();
                if (currentIndex === -1 && playlist.length > 0) playTrack(playlist.length - 1);
                driveUrlInput.value = '';
            } else {
                alert('Đường link file Google Drive không đúng cấu trúc chuẩn!');
            }
        } else {
            alert('Đường link không đúng định dạng Google Drive hợp lệ!');
        }
    });

    // Hàm trích xuất ID file
    function extractFileId(url) {
        const matches = url.match(/\/file\/d\/([a-zA-Z0-9-_]+)/);
        return matches ? matches[1] : null;
    }

    // Hàm trích xuất ID folder
    function extractFolderId(url) {
        const matches = url.match(/\/folders\/([a-zA-Z0-9-_]+)/);
        if (matches) return matches[1];
        const paramMatches = url.match(/[?&]id=([a-zA-Z0-9-_]+)/);
        return paramMatches ? paramMatches[1] : null;
    }

    // Lấy danh sách file từ thư mục Google Drive công khai (Yêu cầu folder ở chế độ Anyone with link can view)
    function fetchGoogleDriveFolder(folderId) {
        // Sử dụng một proxy hoặc công cụ mở của Google Script (Ở đây cấu hình chạy trực tiếp link nén của Google)
        // Cách tối ưu nhất cho client-side là tạo 1 file đơn để stream, với thư mục ta add tạm phần tử đại diện
        // Hoặc bạn có thể thêm API key của bạn vào đây để quét toàn bộ file:
        const proxyUrl = `https://allorigins.win{encodeURIComponent('https://google.com' + folderId)}`;
        
        fetch(proxyUrl)
            .then(response => response.json())
            .then(data => {
                // Phân tích HTML từ trang nhúng thư mục của Google để lấy danh sách file mà không cần API Key phức tạp
                const html = data.contents;
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const scriptTags = doc.querySelectorAll('script');
                let foundFiles = false;

                scriptTags.forEach(script => {
                    const content = script.textContent;
                    if (content.includes('initFolder')) {
                        // Tìm kiếm các chuỗi ID file nằm trong dữ liệu cấu trúc của Google
                        const idRegex = /"([a-zA-Z0-9-_]{25,})"/g;
                        let match;
                        let ids = [];
                        while ((match = idRegex.exec(content)) !== null) {
                            // Lọc các ID hợp lệ tránh trùng lặp với ID thư mục gốc
                            if (match[1] !== folderId && !ids.includes(match[1])) {
                                ids.push(match[1]);
                            }
                        }
                        
                        if(ids.length > 0) {
                            ids.forEach((id, index) => {
                                playlist.push({
                                    name: `Folder Item #${index + 1} (${id.substring(0,5)})`,
                                    url: `https://google.com{id}`,
                                    type: 'video/mp4'
                                });
                            });
                            foundFiles = true;
                        }
                    }
                });

                if (foundFiles) {
                    updatePlaylistUI();
                    if (currentIndex === -1) playTrack(0);
                    driveUrlInput.value = '';
                } else {
                    // Phương án dự phòng nếu quét HTML thất bại: Thêm file stream tổng quát
                    alert('Không thể tự động quét hàng loạt file từ thư mục này do chính sách bảo mật của Google. Hãy thử thêm link từng file riêng lẻ!');
                }
            })
