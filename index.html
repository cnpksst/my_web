<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Phát Nhạc Playlist</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; margin-bottom: 20px; font-size: 20px; }
        .section {
            margin-bottom: 15px;
            background: #2a2a2a;
            padding: 12px;
            border-radius: 10px;
        }
        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            box-sizing: border-box;
            background: #333;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
        }
        button {
            background: #1db954;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        button:active { background: #1aa34a; }
        audio {
            width: 100%;
            margin-top: 15px;
        }
        .playlist {
            max-height: 150px;
            overflow-y: auto;
            background: #121212;
            border-radius: 6px;
            padding: 5px;
            margin-top: 10px;
        }
        .playlist-item {
            padding: 6px 8px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid #222;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playlist-item.active {
            color: #1db954;
            font-weight: bold;
        }
        .timer-display {
            text-align: center;
            font-size: 14px;
            color: #b3b3b3;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎵 Web Phát Nhạc Playlist</h2>

    <!-- 1. Chọn nhiều file hoặc thư mục trên thiết bị -->
    <div class="section">
        <label>📂 Chọn thư mục hoặc nhiều file MP3:</label>
        <input type="file" id="localFiles" accept="audio/*" multiple webkitdirectory>
    </div>

    <!-- 2. Tải danh sách bài hát có sẵn cùng thư mục trên GitHub/Server -->
    <div class="section">
        <label>🌐 Nhạc có sẵn trên Server/GitHub:</label>
        <button onclick="loadServerPlaylist()">Tải danh sách nhạc cố định</button>
    </div>

    <!-- Danh sách bài hát -->
    <div class="section">
        <label>📜 Danh sách phát:</label>
        <div class="playlist" id="playlistContainer">
            <div style="text-align:center; color:#777; font-size:12px; padding:10px;">Chưa có bài hát nào</div>
        </div>
    </div>

    <!-- Trình phát nhạc Audio -->
    <audio id="audioPlayer" controls></audio>

    <!-- 3. Hẹn giờ tắt -->
    <div class="section">
        <label>⏱️ Hẹn giờ tắt (phút):</label>
        <div style="display: flex; gap: 8px; margin-top: 6px;">
            <input type="number" id="timerMinutes" placeholder="Số phút" min="1" style="margin-top:0;">
            <button onclick="startTimer()" style="margin-top:0; width: 120px;">Bắt đầu</button>
        </div>
        <div class="timer-display" id="timerStatus">Chưa hẹn giờ</div>
    </div>
</div>

<script>
    const audioPlayer = document.getElementById('audioPlayer');
    const playlistContainer = document.getElementById('playlistContainer');
    
    let playlist = [];
    let currentIndex = 0;

    // Tự động quét và lập danh sách từ thư mục/file người dùng chọn trên thiết bị
    document.getElementById('localFiles').addEventListener('change', function(event) {
        const files = event.target.files;
        for (let file of files) {
            if (file.type.startsWith('audio/') || file.name.match(/\.(mp3|m4a|wav|aac)$/i)) {
                // Kiểm tra tránh trùng lặp
                if (!playlist.some(p => p.name === file.name)) {
                    playlist.push({
                        name: file.name,
                        url: URL.createObjectURL(file)
                    });
                }
            }
        }
        renderPlaylist();
        if (playlist.length > 0 && audioPlayer.paused && !audioPlayer.src) {
            playTrack(0);
        }
    });

    // Danh sách các bài hát đặt chung thư mục với index.html trên Server/GitHub
    // Bạn chỉ cần sửa tên file bên dưới cho khớp với file bạn tải lên GitHub
    const serverSongs = [
        { name: "BaiHat1.mp3", url: "./BaiHat1.mp3" },
        { name: "BaiHat2.mp3", url: "./BaiHat2.mp3" }
    ];

    function loadServerPlaylist() {
        serverSongs.forEach(song => {
            if (!playlist.some(p => p.url === song.url)) {
                playlist.push(song);
            }
        });
        renderPlaylist();
        if (playlist.length > 0 && audioPlayer.paused && !audioPlayer.src) {
            playTrack(0);
        }
        alert("Đã tải danh sách nhạc từ server!");
    }

    // Hiển thị danh sách phát ra giao diện
    function renderPlaylist() {
        if (playlist.length === 0) {
            playlistContainer.innerHTML = '<div style="text-align:center; color:#777; font-size:12px; padding:10px;">Chưa có bài hát nào</div>';
            return;
        }
        playlistContainer.innerHTML = '';
        playlist.forEach((track, index) => {
            const item = document.createElement('div');
            item.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
            item.innerText = `${index + 1}. ${track.name}`;
            item.onclick = () => playTrack(index);
            playlistContainer.appendChild(item);
        });
    }

    // Phát bài hát theo chỉ mục
    function playTrack(index) {
        if (index < 0 || index >= playlist.length) return;
        currentIndex = index;
        audioPlayer.src = playlist[currentIndex].url;
        audioPlayer.load();
        audioPlayer.play().catch(e => console.log("Cần bấm Play thủ công"));
        renderPlaylist();
    }

    // Tự động chuyển bài khi kết thúc bài hiện tại
    audioPlayer.onended = function() {
        if (currentIndex < playlist.length - 1) {
            playTrack(currentIndex + 1);
        }
    };

    // Hẹn giờ tắt nhạc
    let countdown;
    function startTimer() {
        clearInterval(countdown);
        const minutes = parseInt(document.getElementById('timerMinutes').value);
        if (isNaN(minutes) || minutes <= 0) {
            alert('Vui lòng nhập số phút hợp lệ!');
            return;
        }

        let timeRemaining = minutes * 60;
        const statusDisplay = document.getElementById('timerStatus');

        countdown = setInterval(() => {
            let m = Math.floor(timeRemaining / 60);
            let s = timeRemaining % 60;
            statusDisplay.innerText = `Tự động tắt sau: ${m}p ${s < 10 ? '0' : ''}${s}s`;

            if (timeRemaining <= 0) {
                clearInterval(countdown);
                audioPlayer.pause();
                audioPlayer.currentTime = 0;
                statusDisplay.innerText = 'Đã hẹn giờ tắt nhạc!';
            }
            timeRemaining--;
        }, 1000);
    }
</script>

</body>
</html>
